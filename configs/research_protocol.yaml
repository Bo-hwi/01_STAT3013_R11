# Research protocol starter aligned to Proposal v4 / Team Roles v4.
# REVIEW REQUIRED: placeholders must be finalized before any held-out evaluation.
project:
  name: weather_favorita
  duration_weeks: 4  # 26/10/2026 - 22/11/2026 (Proposal v4.1)
  seed: 42  # Proposed reproducibility default; confirm with team.

scope:
  stores_expected: 54
  cities_expected: 22
  families_eda_expected: 33
  deep_study_family_count_min: 6
  deep_study_family_count_max: 8
  deep_study_families: []  # TODO: freeze shortlist based on train-only criteria.
  unit_of_analysis: [date, store_nbr, family]
  target: sales
  source_period: ["2013-01-01", "2017-08-15"]  # Verify exact coverage in local raw files.

sources:
  sales: "Kaggle Store Sales - Time Series Forecasting / Corporacion Favorita"
  weather: "Open-Meteo Historical Weather API / ERA5 reanalysis"
  weather_join_key: [city, date]
  weather_availability: retrospective_reanalysis
  weather_warning: >-
    ERA5 weather lags are not necessarily available at forecast origin.
    Do not claim strict operational performance without timestamp evidence.

rq1:
  outcome_transform: log1p
  models: [pooled_ols, fixed_effects, random_effects]
  primary_specification: fixed_effects
  panel_entity: [store_nbr, family]
  explanatory_weather_t_allowed: true  # Association, not RQ2 forecasting.
  report_confidence_level: 0.95
  multiple_testing: fdr
  uncertainty_method: TODO_cluster_or_block_bootstrap_with_justification
  causal_claims: false

rq2:
  forecast_horizon_days: 1
  forecast_origin: end_of_day_t_minus_1
  forecast_grain: [date, store_nbr, family]
  allowed_features:
    calendar_known_for_target_date: true
    sales_lags_days: [1, 7, 14, 28]
    rolling_statistics: "shift by >=1 day before rolling"
    store_family_city_identifiers: true
    onpromotion_t: conditional_on_verified_advance_schedule
    weather_lags: conditional_on_retrospective_or_verified_availability
  forbidden_features: [sales_t, transactions_t, measured_rain_t, measured_temperature_t]
  baselines:
    seasonal_naive_lag_days: 7
    trailing_moving_average_windows_candidate: [7, 28]
  point_models: [ridge, extra_trees, global_hist_gradient_boosting]
  global_boosted_alternative: lightgbm  # Choose ONE global boosted algorithm.
  ablation_config_file: configs/ablation_M0_M5.yaml
  validation:
    scheme: rolling_origin
    nonoverlapping_test_folds: true
    training_precedes_test: true
    inner_validation_for_tuning: true
    test_folds: []  # TODO: explicit date ranges, frozen before final evaluation.
  primary_metric: MAE
  secondary_metrics: [WAPE_if_denominator_positive, MASE_if_valid]
  report_by: [family, city, fold_id]
  uncertainty: paired_block_bootstrap_95ci  # Final block design requires justification.

quantile_and_decision:
  quantiles: [0.50, 0.75, 0.8333333333]
  primary_quantile_model: TODO_choose_quantile_regressor
  compare_weather: [M0, M3]
  weather_extension_if_qa_passes: M4
  costs:
    # Ratios are assumptions, NOT observed retailer costs.
    - {over: 1, under: 1}
    - {over: 1, under: 3}
    - {over: 1, under: 5}
  demand_proxy: observed_sales
  nonnegative_order_quantity: true
  policy_selection_uses_test_labels: false
  report_metrics: [pinball_loss, quantile_coverage, simulated_cost_index]

outputs:
  curated_table: data/processed/curated_sales_weather.parquet
  feature_table: data/processed/model_features.parquet
  prediction_directory: results/predictions
  figures_directory: results/figures
  tables_directory: results/tables
  decision_matrix_required_columns:
    - family
    - city
    - sample_size
    - zero_rate
    - weather_signature
    - baseline_error
    - weather_error
    - delta_error_pct
    - confidence_interval
    - fold_consistency
    - cost_scenarios
    - uncertainty_flag
    - source_QA_flag
    - recommendation
    - interpretation

reproducibility:
  record_source_sha256: true
  record_weather_coordinates_and_units: true
  record_available_at: true
  record_fold_id_and_experiment_id: true
  record_package_versions: true
  verify_unique_sales_keys: true
  verify_many_to_one_weather_join: true
  check_temporal_leakage: true
